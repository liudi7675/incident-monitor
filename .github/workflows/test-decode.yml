name: test-decode
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Bing RSS
        run: |
          cat > /tmp/t.mjs << 'EOF'
          const q = encodeURIComponent('(遇难 OR 失联 OR 火灾 OR 爆炸 OR 泥石流) (site:gov.cn OR site:news.cn OR site:mem.gov.cn OR site:cctv.com OR site:people.com.cn)');
          const res = await fetch('https://www.bing.com/news/search?q=' + q + '&format=rss&setmkt=zh-CN', {
            signal: AbortSignal.timeout(20000),
          });
          const xml = await res.text();
          console.log('HTTP', res.status, 'LEN', xml.length);
          const items = [...xml.matchAll(/<item>[\s\S]*?<\/item>/g)].slice(0, 4);
          for (const it of items) {
            const link = (it[0].match(/<link>([\s\S]*?)<\/link>/) || [])[1] || '';
            const title = (it[0].match(/<title>([\s\S]*?)<\/title>/) || [])[1] || '';
            console.log('T:', title.slice(0, 40));
            console.log('L:', link.slice(0, 120));
          }
          EOF
          node /tmp/t.mjs

name: test-decode
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe article page
        run: |
          cat > /tmp/t.mjs << 'EOF'
          const fs = await import('node:fs');
          const j = JSON.parse(fs.readFileSync('data/flashes.json', 'utf8'));
          const it = (j.items || []).find(i => i.url && i.url.includes('news.google.com'));
          const url = it.url;
          console.log('URL:', url.slice(0, 90));
          const res = await fetch(url, {
            headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36' },
            signal: AbortSignal.timeout(20000),
            redirect: 'follow',
          });
          console.log('HTTP', res.status, 'final:', res.url.slice(0, 90));
          const html = await res.text();
          console.log('HTML LEN', html.length);
          console.log('has data-n-au:', html.includes('data-n-au'));
          console.log('has c-wiz:', html.includes('c-wiz'));
          const au = html.match(/data-n-au="([^"]+)"/);
          console.log('data-n-au:', au ? au[1].slice(0, 100) : 'NONE');
          // 所有非google域名的外链样例
          const links = [...html.matchAll(/https?:\/\/(?!www\.google|news\.google|accounts|policies|support)[a-z0-9.-]+[^\s"'<>]*/gi)].map(m => m[0]).slice(0, 5);
          console.log('sample links:', JSON.stringify(links, null, 0).slice(0, 500));
          EOF
          node /tmp/t.mjs

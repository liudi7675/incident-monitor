name: wecom-patrol
on:
  schedule:
    # 每 15 分钟巡检一轮（2026-09-21 从每小时提频：缩短重大事件的推送延迟，
    # 事件发布后最晚约15分钟推群；去重状态保证同一事件只推一次）
    # 错开 4/34 分的 update-data 任务和整点 Actions 调度拥堵
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wecom-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patrol & push WeCom
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PATROL_DRY_RUN: '0'   # 正式推送模式
        run: node scripts/wecom-patrol.mjs

      - name: Commit patrol state
        run: |
          STATE=data/wecom-patrol-state.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "no state change, skip commit"
            exit 0
          fi
          # 外部定时器每 15 分钟触发一次，而每轮运行都会刷新 lastRunTs。
          # 若无条件提交，会产生每天约 96 次 bot 提交并连带触发同样次数的 Pages 部署。
          # 因此只在「确实推送了新事件」或「距上次状态提交已超过 6 小时」时才提交。
          OLD_PUSHED=$(git show HEAD:$STATE 2>/dev/null | python3 -c "import sys,json;print(json.dumps(json.load(sys.stdin).get('pushed',{}),sort_keys=True))" 2>/dev/null || echo '{}')
          NEW_PUSHED=$(python3 -c "import json;print(json.dumps(json.load(open('$STATE')).get('pushed',{}),sort_keys=True))")
          OLD_UPDATED=$(git show HEAD:$STATE 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('updated',''))" 2>/dev/null || echo '')
          OLD_TS=$(date -d "$OLD_UPDATED" +%s 2>/dev/null || echo 0)
          AGE=$(( $(date +%s) - OLD_TS ))
          if [ "$OLD_PUSHED" = "$NEW_PUSHED" ] && [ "$AGE" -lt 21600 ]; then
            echo "本轮无新推送且上次状态提交在 $((AGE / 60)) 分钟前（<6h），跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$STATE"
          git commit -m "chore(data): update wecom patrol state $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i..."
            sleep 10
          done

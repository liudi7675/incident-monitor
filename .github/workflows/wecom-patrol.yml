name: wecom-patrol
on:
  # schedule:
  #   - cron: '0 * * * *'   # ⏸ 已暂停（2026-09-21 排查顺德火灾漏推），排查完成后再恢复
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wecom-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patrol & push WeCom
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PATROL_DRY_RUN: '0'   # 正式推送模式（每小时整点，推上一小时内重大事件）
        run: node scripts/wecom-patrol.mjs

      - name: Commit patrol state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no state change, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/wecom-patrol-state.json
            git commit -m "chore(data): update wecom patrol state $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push retry $i..."
              sleep 10
            done
          fi

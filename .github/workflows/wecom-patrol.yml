name: wecom-patrol
on:
  schedule:
    # 每 15 分钟巡检一轮（2026-09-21 从每小时提频：缩短重大事件的推送延迟，
    # 事件发布后最晚约15分钟推群；去重状态保证同一事件只推一次）
    # 错开 4/34 分的 update-data 任务和整点 Actions 调度拥堵
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wecom-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patrol & push WeCom
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PATROL_DRY_RUN: '0'   # 正式推送模式（每小时整点，推上一小时内重大事件）
        run: node scripts/wecom-patrol.mjs

      - name: Commit patrol state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no state change, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f data/wecom-patrol-state.json
            git commit -m "chore(data): update wecom patrol state $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push retry $i..."
              sleep 10
            done
          fi

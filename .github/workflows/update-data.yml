name: Update Incident Flash Data

on:
  schedule:
    # 每 10 分钟自动抓取一次最新新闻快讯（GitHub 公开仓库 Actions 免费）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: incident-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest news
        run: node scripts/fetch-news.mjs

      # 企业微信快讯推送已停用（2026-09-12 用户要求：只推重大事件，
      # 由每2小时巡检自动化推送，关键词快讯会误伤评论类文章故不再启用）
      # - name: Notify WeCom for severe domestic flashes
      #   env:
      #     WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      #   run: node scripts/wecom-flash.mjs

      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "no data change, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): update incident flashes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

name: Update Incident Flash Data

on:
  schedule:
    # 每 10 分钟自动抓取一次最新新闻快讯（GitHub 公开仓库 Actions 免费）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: incident-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest news
        run: node scripts/fetch-news.mjs

      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "no data change, skip commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/flashes.json
            git commit -m "chore(data): update incident flashes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

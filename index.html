<style>
:root {
  --red: #C62828; --red-dark: #B71C1C; --orange: #E65100; --amber: #F9A825;
  --blue: #1565C0; --purple: #6A1B9A; --bg: #F5F6F8; --panel: #FFFFFF;
  --ink: #1F2430; --ink-2: #4A5162; --ink-3: #8A92A6; --line: #E3E6EC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.6;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
/* ---------- 头部 ---------- */
header {
  background: linear-gradient(135deg, #8E1616, #C62828); color: #fff;
  padding: 14px 22px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 5;
}
header .brand { display: flex; align-items: center; gap: 10px; }
header .logo {
  width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
header h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
header .sub { font-size: 12px; opacity: .85; margin-top: 1px; }
header .spacer { flex: 1; }
header .update-info { font-size: 12px; opacity: .9; text-align: right; line-height: 1.4; }
header .stats-chips { display: flex; gap: 8px; }
header .chip {
  background: rgba(255,255,255,.14); border-radius: 6px; padding: 4px 10px;
  font-size: 12px; text-align: center; line-height: 1.3;
}
header .chip b { display: block; font-size: 17px; font-weight: 700; }
#refreshBtn {
  background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.45);
  border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px;
  transition: background .2s;
}
#refreshBtn:hover { background: rgba(255,255,255,.28); }
#refreshBtn.busy { opacity: .6; pointer-events: none; }
.auto-badge {
  background: rgba(255,255,255,.12); border: 1px dashed rgba(255,255,255,.5);
  border-radius: 6px; padding: 4px 10px; font-size: 12px; white-space: nowrap;
}
/* 新快讯弹窗 */
.alert-mask {
  position: fixed; inset: 0; background: rgba(15,18,24,.5); z-index: 100;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.alert-mask.show { display: flex; }
.alert-box {
  background: #fff; border-radius: 12px; max-width: 460px; width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden; animation: pop .25s ease;
  position: relative;
}
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.alert-head {
  background: linear-gradient(135deg, #B71C1C, #E53935); color: #fff;
  padding: 12px 16px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px;
}
.alert-head .alert-x {
  margin-left: auto; cursor: pointer; font-size: 16px; line-height: 1;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,255,255,.18); transition: background .15s;
}
.alert-head .alert-x:hover { background: rgba(255,255,255,.32); }
.alert-list { padding: 8px 14px; max-height: 260px; overflow-y: auto; position: relative; z-index: 0; }
.alert-item {
  display: flex; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed var(--line);
  font-size: 13px; color: var(--ink);
}
.alert-item:last-child { border-bottom: none; }
.alert-item .alert-tag {
  flex-shrink: 0; background: #FFEBEE; color: var(--red-dark); font-size: 11px;
  border-radius: 4px; padding: 1px 7px; height: fit-content;
}
.alert-item .alert-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.alert-close {
  display: block; width: calc(100% - 28px); margin: 0 14px 14px; padding: 9px;
  background: var(--red); color: #fff; border: none; border-radius: 7px; font-size: 14px;
  cursor: pointer; transition: background .15s;
  position: relative; z-index: 2; pointer-events: auto;
}
.alert-close:hover { background: var(--red-dark); }
/* ---------- 主体 ---------- */
main { flex: 1; display: flex; min-height: 0; }
/* 左栏：简报 */
#feedPane {
  width: 460px; min-width: 380px; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
#briefCard {
  margin: 14px 14px 0; border: 1px solid var(--line); border-left: 4px solid var(--red);
  border-radius: 8px; padding: 14px 16px; background: #FFF8F7;
}
#briefCard h2 { font-size: 15px; color: var(--red-dark); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
#briefCard h2 .tag { font-size: 11px; background: var(--red); color: #fff; border-radius: 4px; padding: 1px 7px; font-weight: 400; }
#briefMeta { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
#briefBody { font-size: 13px; color: var(--ink-2); text-align: justify; }
#briefBody b { color: var(--red-dark); }
#briefBody ul { margin: 6px 0 0 18px; }
#briefBody li { margin: 3px 0; }
/* 筛选 */
#filters { display: flex; gap: 6px; padding: 12px 14px 8px; flex-wrap: wrap; }
#filters button {
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  border-radius: 14px; padding: 4px 14px; font-size: 12.5px; cursor: pointer; transition: all .15s;
}
#filters button:hover { border-color: var(--red); color: var(--red); }
#filters button.active { background: var(--red); border-color: var(--red); color: #fff; }
#feedMeta { padding: 0 16px 6px; font-size: 12px; color: var(--ink-3); }
/* 列表 */
#feedList { flex: 1; overflow-y: auto; padding: 4px 14px 20px; min-height: 0; }
.card {
  border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  background: #fff; cursor: pointer; transition: box-shadow .15s, transform .15s; position: relative;
}
.card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.09); }
.card.highlight { border-color: var(--red); box-shadow: 0 0 0 2px rgba(198,40,40,.18); }
.card .row1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }
.badge { font-size: 11px; border-radius: 4px; padding: 1px 7px; color: #fff; white-space: nowrap; }
.b-level-1 { background: #B71C1C; } .b-level-2 { background: #E65100; }
.b-level-3 { background: #D4A017; } .b-level-4 { background: #757575; }
.b-type { background: #EDF1F7; color: var(--ink-2); }
.b-scope-dom { background: #DCEBDD; color: #1B5E20; }
.b-scope-intl { background: #E3EAF6; color: #0D47A1; }
.card .date { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card .place { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
.card .cas { display: flex; gap: 14px; font-size: 12.5px; margin-bottom: 6px; flex-wrap: wrap; }
.card .cas span b { font-weight: 700; }
.cas .d b { color: var(--red-dark); } .cas .i b { color: var(--orange); } .cas .m b { color: var(--purple); }
.card .sum {
  font-size: 12.5px; color: var(--ink-2); text-align: justify;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card .instr {
  margin-top: 8px; border-left: 3px solid var(--red); background: #FFF4F3;
  padding: 7px 10px; font-size: 12.5px; color: #7B1D16; border-radius: 0 5px 5px 0;
}
.card .instr b { color: var(--red-dark); }
.card .src { margin-top: 7px; font-size: 12px; }
.card .src a { color: var(--blue); text-decoration: none; }
.card .src a:hover { text-decoration: underline; }
.card .src .loc-mark { color: var(--red); font-size: 12px; margin-right: 8px; }
/* 快讯条目 */
.card.flash h3 { font-size: 13px; }
.card.flash .live-tag { background: #B71C1C; color: #fff; font-size: 10px; border-radius: 3px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
/* ---------- 右侧：地图 ---------- */
#mapPane { flex: 1; position: relative; min-width: 0; }
#map { position: absolute; inset: 0; }
#mapFallback {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: var(--bg); color: var(--ink-3); font-size: 13px; text-align: center; padding: 40px;
}
#legend {
  position: absolute; left: 14px; bottom: 18px; background: rgba(255,255,255,.94);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; z-index: 10;

#legend .t { font-weight: 700; margin-bottom: 6px; color: var(--ink); }
#legend .item { display: flex; align-items: center; gap: 7px; margin: 3px 0; color: var(--ink-2); }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#mapTip {
  position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,.94);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; z-index: 10;
  font-size: 12px; color: var(--ink-2); box-shadow: 0 2px 8px rgba(0,0,0,.1);

/* 弹窗样式（注入地图 InfoWindow） */
.iw { max-width: 280px; font-family: inherit; }
.iw .iw-t { font-size: 13.5px; font-weight: 700; color: #1F2430; margin-bottom: 4px; }
.iw .iw-c { font-size: 12px; color: #B71C1C; font-weight: 600; }
.iw .iw-p { font-size: 11.5px; color: #4A5162; margin-top: 4px; }
.iw .iw-i { font-size: 11.5px; color: #7B1D16; margin-top: 5px; border-top: 1px dashed #E3C2BE; padding-top: 4px; }
/* toast */
#toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-8px);
  background: rgba(31,36,48,.92); color: #fff; font-size: 13px; padding: 9px 18px;
  border-radius: 6px; opacity: 0; pointer-events: none; transition: all .3s; z-index: 99;

#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* 滚动条 */
#feedList::-webkit-scrollbar { width: 6px; }
#feedList::-webkit-scrollbar-thumb { background: #CDD3DE; border-radius: 3px; }
@media (max-width: 980px) {
  main { flex-direction: column; overflow-y: auto; }
  #feedPane { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--line); }
  #feedList { overflow: visible; }
  #mapPane { min-height: 70vh; }
  body { overflow: auto; }
}

/* =====================================================================
   业务逻辑
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const feedList = $('#feedList');
let currentFilter = 'all';
let liveFlashes = []; // 在线抓取的快讯

const fmt = (n) => (n === null || n === undefined) ? '—' : n;

function casText(it) {
  let parts = [];
  if (it.deaths !== null) parts.push(`<span class="d"><b>${it.deaths}</b> 人遇难</span>`);
  if (it.injured) parts.push(`<span class="i"><b>${it.injured}</b> 人受伤</span>`);
  if (it.missing) parts.push(`<span class="m"><b>${it.missing}</b> 人失联</span>`);
  return parts.length ? parts.join('') : '<span style="color:var(--ink-3)">伤亡情况核查中</span>';
}

function renderStats() {
  const all = [...INCIDENTS, ...liveFlashes];
  const deaths = all.reduce((s, i) => s + (i.deaths || 0), 0);
  const instrCount = all.filter(i => i.instr).length;
  const provs = new Set(INCIDENTS.filter(i => i.prov).map(i => i.prov));
  $('#stCount').textContent = all.length;
  $('#stDeaths').textContent = deaths;
  $('#stInstruct').textContent = instrCount;
  $('#stProv').textContent = provs.size;
}

function renderBrief() {
  const dom = INCIDENTS.filter(i => i.scope === 'dom');
  const intl = INCIDENTS.filter(i => i.scope === 'intl');
  const all = [...INCIDENTS, ...liveFlashes];
  const deaths = all.reduce((s, i) => s + (i.deaths || 0), 0);
  const injured = all.reduce((s, i) => s + (i.injured || 0), 0);
  const missing = all.reduce((s, i) => s + (i.missing || 0), 0);
  const instrCount = all.filter(i => i.instr).length;
  const top = [...INCIDENTS].filter(i => i.deaths && i.deaths >= 5).sort((a, b) => b.deaths - a.deaths).slice(0, 5);
  const topGroup = INCIDENTS.filter(i => /调查组|挂牌|督办|政治局/.test(i.instr || '')).length;

  $('#briefMeta').textContent = `监测周期：2026年5月—8月29日 · 生成时间：${new Date().toLocaleString('zh-CN', { hour12: false })} · 伤亡为不完全统计`;

  $('#briefBody').innerHTML = `
    本期共收录国内外重大突发事件 <b>${all.length}</b> 起（国内 <b>${dom.length}</b> 起、国外 <b>${intl.length}</b> 起），
    累计造成 <b>${deaths}</b> 人遇难、<b>${injured}</b> 人受伤、<b>${missing}</b> 人失联（不完全统计）。
    其中习近平等中央领导同志作出重要指示/批示事项 <b>${instrCount}</b> 起；国务院成立调查组/挂牌督办/政治局专题研究 <b>${topGroup}</b> 起。
    <ul>
      ${top.map(i => `<li><b>${i.date}</b> ${i.title}（${i.deaths}人遇难${i.missing ? '、' + i.missing + '人失联' : ''}${i.instr ? '，中央领导已批示' : ''}）</li>`).join('')}
    </ul>
    <div style="margin-top:6px">国务院安委办已于8月18日通报近期道路交通典型事故并部署加强道路交通安全工作，要求认真贯彻落实习近平总书记关于安全生产的重要指示批示精神，坚决扭转事故多发态势。</div>
  `;
}

function passesFilter(it, f) {
  if (f === 'all') return true;
  if (f === 'dom') return it.scope === 'dom';
  if (f === 'intl') return it.scope === 'intl';
  if (f === 'instr') return !!it.instr;
  if (f === 'fire') return it.type === 'fire';
  if (f === 'blast') return it.type === 'blast';
  if (f === 'geo') return it.type === 'geo' || it.type === 'collapse';
  return true;
}

function renderList() {
  const items = [...INCIDENTS, ...liveFlashes].filter(i => passesFilter(i, currentFilter));
  feedList.innerHTML = items.map(it => {
    if (it.flash) {
      return `<div class="card flash" data-id="${it.id}">
        <div class="row1">
          <span class="badge b-type">${TYPE_NAME[it.type] || '快讯'}</span>
          <span class="badge b-scope-intl">在线快讯</span>
          <span class="date">${it.date}</span>
        </div>
        <h3>${it.title}<span class="live-tag">LIVE</span></h3>
        <div class="src"><a href="${it.url}" target="_blank" rel="noopener">查看来源 ↗</a></div>
      </div>`;
    }
    const scopeBadge = it.scope === 'dom'
      ? '<span class="badge b-scope-dom">国内</span>'
      : '<span class="badge b-scope-intl">国外</span>';
    const locHint = it.scope === 'dom' && it.lat
      ? '<span class="loc-mark">📍 已标记地图</span>' : '';
    return `<div class="card" data-id="${it.id}">
      <div class="row1">
        <span class="badge b-level-${it.level}">${it.levelName}</span>
        <span class="badge b-type">${TYPE_NAME[it.type]}</span>
        ${scopeBadge}
        ${it.instr ? '<span class="badge b-level-1">⚠ 领导批示</span>' : ''}
        <span class="date">${it.date}${it.time ? ' ' + it.time : ''}</span>
      </div>
      <h3>${it.title}</h3>
      <div class="place">📍 ${it.place}</div>
      <div class="cas">${casText(it)}</div>
      <div class="sum">${it.summary}</div>
      ${it.instr ? `<div class="instr"><b>批示/指示要点：</b>${it.instr}</div>` : ''}
      <div class="src">${locHint}来源：${it.url ? `<a href="${it.url}" target="_blank" rel="noopener">${it.source} ↗</a>` : it.source}</div>
    </div>`;
  }).join('') || '<div style="padding:30px;text-align:center;color:var(--ink-3)">暂无符合筛选条件的事件</div>';

  $('#feedMeta').textContent = `共 ${items.length} 条记录`;

  feedList.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      focusIncident(c.dataset.id);
    });
  });
}

/* ---------------- 地图 ---------------- */
let map = null, markers = null, infoWindow = null;
const markerStyles = {};

function markerIcon(type) {
  const color = TYPE_COLOR[type] || TYPE_COLOR.other;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 1C6.4 1 1 6.4 1 13c0 8.5 12 20 12 20s12-11.5 12-20c0-6.6-5.4-12-12-12z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
    <circle cx="13" cy="13" r="4.5" fill="#fff"/>
  </svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function initMap() {
  if (typeof TMap === 'undefined') {
    $('#mapFallback').style.display = 'flex';
    return;
  }
  try {
    map = new TMap.Map('map', { zoom: 4, center: new TMap.LatLng(35.8, 106) });

    Object.keys(TYPE_COLOR).forEach(t => {
      markerStyles[t] = new TMap.MarkerStyle({
        width: 26, height: 34,
        anchor: { x: 13, y: 32 },
        icon: markerIcon(t),
      });
    });

    const domItems = INCIDENTS.filter(i => i.scope === 'dom' && i.lat !== null);
    markers = new TMap.MultiMarker({
      map,
      styles: markerStyles,
      geometries: domItems.map(i => ({
        id: i.id,
        styleId: i.type,
        position: new TMap.LatLng(i.lat, i.lng),
        properties: { incident: i },
      })),
    });

    infoWindow = new TMap.InfoWindow({ map, position: map.getCenter() });
    infoWindow.close();

    markers.on('click', (evt) => {
      const it = evt.geometry.properties.incident;
      openInfo(it);
      highlightCard(it.id, true);
    });
  } catch (e) {
    $('#mapFallback').style.display = 'flex';
  }
}

function openInfo(it) {
  if (!map || !infoWindow) return;
  const iw = `<div class="iw">
    <div class="iw-t">${it.title}</div>
    <div class="iw-c">${it.deaths !== null ? it.deaths + ' 人遇难' : '伤亡核查中'}${it.injured ? ' · ' + it.injured + ' 人受伤' : ''}${it.missing ? ' · ' + it.missing + ' 人失联' : ''}</div>
    <div class="iw-p">${it.date}${it.time ? ' ' + it.time : ''} · ${it.place}</div>
    ${it.instr ? `<div class="iw-i">⚠ 中央领导已作出批示/指示</div>` : ''}
  </div>`;
  infoWindow.setPosition(new TMap.LatLng(it.lat, it.lng));
  infoWindow.setContent(iw);
  infoWindow.open();
}

function focusIncident(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('highlight'));
  if (!map) return;
  const it = INCIDENTS.find(i => i.id === id);
  if (!it || it.lat === null) return;
  highlightCard(id, false);
  map.setZoom(9);
  map.setCenter(new TMap.LatLng(it.lat, it.lng));
  openInfo(it);
}

function highlightCard(id, scroll) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('highlight'));
  card.classList.add('highlight');
  if (scroll) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------------- 在线快讯刷新（尽力而为） ---------------- */
const FEED_SOURCES = [
  { name: '国内要闻', url: 'https://news.google.com/rss/search?q=%E7%81%AB%E7%81%BE+OR+%E7%88%86%E7%82%B8+OR+%E4%BA%8B%E6%95%85+%E9%81%87%E9%9A%BE+when:7d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans' },
  { name: '地质气象灾害', url: 'https://news.google.com/rss/search?q=%E6%B3%A5%E7%9F%B3%E6%B5%81+OR+%E5%B1%B1%E4%BD%93%E6%BB%91%E5%9D%A1+OR+%E6%B4%AA%E6%B0%B4+OR+%E5%9C%B0%E9%9C%87+%E9%81%87%E9%9A%BE+when:7d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans' },
  { name: '国际事故', url: 'https://news.google.com/rss/search?q=explosion+OR+fire+OR+mudslide+OR+landslide+killed+when:7d&hl=en-US&gl=US&ceid=US:en' },
];
const KEY_RE = /(火灾|爆炸|燃爆|坍塌|泥石流|滑坡|山体滑塌|洪水|溃坝|地震|倾覆|侧翻|遇难|致死|身亡|死亡|失联|killed|dead|explosion|fire|mudslide|landslide|flood|earthquake)/i;

async function fetchLive() {
  const btn = $('#refreshBtn');
  btn.classList.add('busy');
  btn.textContent = '⏳ 正在抓取…';
  let got = 0;
  try {
    const results = await Promise.all(FEED_SOURCES.map(async (src) => {
      try {
        const r = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`, { signal: AbortSignal.timeout(12000) });
        const j = await r.json();
        return (j.items || []).map(item => ({ ...item, src: src.name }));
      } catch { return []; }
    }));
    const seen = new Set(liveFlashes.map(i => i.title)); // 已有的（含云端）标题不再重复加入
    const newItems = results.flat()
      .filter(item => KEY_RE.test(item.title || ''))
      .filter(item => { if (seen.has(item.title)) return false; seen.add(item.title); return true; })
      .slice(0, 15)
      .map((item, idx) => ({
        id: 'LIVE-' + Date.now() + '-' + idx,
        flash: true,
        date: (item.pubDate || '').slice(0, 10) || new Date().toISOString().slice(0, 10),
        scope: item.src === '国际事故' ? 'intl' : 'dom',
        type: /泥石流|滑坡|洪水|地震|mudslide|landslide|flood|earthquake/i.test(item.title) ? 'geo'
            : (/爆炸|燃爆|explosion/i.test(item.title) ? 'blast'
            : (/火|fire/i.test(item.title) ? 'fire' : 'other')),
        title: item.title,
        url: item.link || '#',
        deaths: null, injured: null, missing: null, instr: '', lat: null, lng: null,
      }));
    got = newItems.length;
    if (newItems.length) {
      liveFlashes = [...newItems, ...liveFlashes].slice(0, 40);
      liveFlashes.sort((a, b) => b.date.localeCompare(a.date));
      renderList(); renderStats();
      checkNewEvents(newItems);
    }
    toast(got > 0 ? `已更新 ${got} 条最新快讯` : '暂未抓取到符合条件的最新快讯，仍显示本地快照');
  } catch {
    toast('网络受限，仍显示本地快照数据');
  }
  lastFetchAt = Date.now();
  updateAutoStatus();
  $('#updateInfo').innerHTML = `数据快照：2026-08-29<br>快讯更新：${got ? new Date().toLocaleString('zh-CN', { hour12: false }) : '未更新'}`;
  btn.classList.remove('busy');
  btn.textContent = '⟳ 刷新快讯';
}

/* ---------------- 新事件检测：弹窗 + 浏览器通知 ---------------- */
let knownIds = new Set(INCIDENTS.map(i => i.id));
let lastFetchAt = 0;
const AUTO_INTERVAL = 10 * 60 * 1000; // 每10分钟自动刷新

function checkNewEvents(items) {
  const fresh = items.filter(i => !knownIds.has(i.id));
  fresh.forEach(i => knownIds.add(i.id));
  if (!fresh.length) return;
  showNewAlert(fresh);
  browserNotify(fresh);
}

function showNewAlert(fresh) {
  const list = fresh.slice(0, 6).map(i => `
    <div class="alert-item">
      <span class="alert-tag">${TYPE_NAME[i.type] || '快讯'}</span>
      <div><b>${i.title}</b><div class="alert-meta">${i.date} · ${i.scope === 'dom' ? '国内' : '国外'}</div></div>
    </div>`).join('');
  $('#alertList').innerHTML = list + (fresh.length > 6 ? `<div style="text-align:center;color:var(--ink-3);font-size:12px;padding:6px">… 共 ${fresh.length} 条</div>` : '');
  $('#newAlert').classList.add('show');
}

function browserNotify(fresh) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification('🚨 重大突发事件新快讯', {
      body: fresh.slice(0, 3).map(i => i.title).join('\n'),
      tag: 'wb-emergency',
    });
  } catch (e) { /* 忽略通知失败 */ }
}

function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

/* ---------------- 云端数据加载（GitHub Actions 自动生成的 data/flashes.json） ---------------- */
async function loadRemoteFlashes() {
  try {
    const r = await fetch('data/flashes.json', { signal: AbortSignal.timeout(8000) });
    if (!r.ok) return;
    const j = await r.json();
    const items = (j.items || []).map(item => ({
      id: item.id || ('FL-' + item.title),
      flash: true,
      date: item.date || (item.dateISO || '').slice(0, 10) || new Date().toISOString().slice(0, 10),
      scope: item.scope === 'intl' ? 'intl' : 'dom',
      type: item.type || 'other',
      title: item.title,
      url: item.url || '#',
      deaths: null, injured: null, missing: null, instr: '', lat: null, lng: null,
    }));
    if (!items.length) return;
    const seen = new Set(liveFlashes.map(i => i.title));
    const fresh = items.filter(i => !seen.has(i.title));
    liveFlashes = [...fresh, ...liveFlashes].slice(0, 40);
    liveFlashes.sort((a, b) => b.date.localeCompare(a.date));
    renderList(); renderStats();
    checkNewEvents(fresh);
    if (j.updated) {
      $('#updateInfo').innerHTML = `数据快照：2026-08-29<br>云端数据：${j.updated.replace('T', ' ').slice(0, 16)} UTC`;
    }
  } catch { /* 无 data.json（纯静态打开）时静默 */ }
}

/* ---------------- 自动刷新调度 ---------------- */
function startAutoRefresh() {
  setInterval(fetchLive, AUTO_INTERVAL);
  lastFetchAt = Date.now();
  updateAutoStatus();
  setInterval(updateAutoStatus, 1000);
}

function updateAutoStatus() {
  const el = $('#autoStatus');
  if (!lastFetchAt) return;
  const remain = AUTO_INTERVAL - (Date.now() - lastFetchAt);
  if (remain <= 0) { el.textContent = '自动刷新中…'; return; }
  const mm = String(Math.floor(remain / 60000)).padStart(2, '0');
  const ss = String(Math.floor((remain % 60000) / 1000)).padStart(2, '0');
  el.textContent = `每10分钟自动刷新 · 下次刷新倒计时 ${mm}:${ss}`;
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------------- 事件绑定 ---------------- */
/* 弹窗关闭：多途径兜底（内联 onclick + 监听 × / 遮罩 / Esc） */
function closeAlert() {
  const el = document.getElementById('newAlert');
  if (el) el.classList.remove('show');
}
document.querySelectorAll('#filters button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#filters button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.dataset.f;
    renderList();
  });
});
$('#refreshBtn').addEventListener('click', () => { requestNotifPermission(); fetchLive(); });
const alertCloseBtn = document.getElementById('alertClose');
if (alertCloseBtn) alertCloseBtn.addEventListener('click', closeAlert);
const alertXBtn = document.getElementById('alertX');
if (alertXBtn) alertXBtn.addEventListener('click', closeAlert);
const alertMask = document.getElementById('newAlert');
if (alertMask) alertMask.addEventListener('click', (e) => { if (e.target === alertMask) closeAlert(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAlert(); });

/* ---------------- 启动 ---------------- */
renderStats();
renderBrief();
renderList();
initMap();
loadRemoteFlashes(); // 加载云端自动更新快讯（GitHub Pages 部署时生效）
startAutoRefresh();
</script>
